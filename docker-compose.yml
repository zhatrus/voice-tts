name: ukrainian-voice
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8001}:8000"
    volumes:
      - models:/home/app/.cache/huggingface
      - data:/data
    environment:
      - DEVICE=${DEVICE:-gpu}
      - MODEL_REPO=${MODEL_REPO:-patriotyk/styletts2_ukrainian_multispeaker}
      - VOICES_SPACE_REPO=${VOICES_SPACE_REPO:-patriotyk/styletts2-ukrainian}
      - DEFAULT_VOICE=${DEFAULT_VOICE:-}
      - DEFAULT_FORMAT=${DEFAULT_FORMAT:-wav}
      - DEFAULT_SAMPLE_RATE=${DEFAULT_SAMPLE_RATE:-24000}
      - VERBALIZE=${VERBALIZE:-true}
      - MODEL_IDLE_TIMEOUT_MIN=${MODEL_IDLE_TIMEOUT_MIN:-30}
      - MAX_TEXT_LEN=${MAX_TEXT_LEN:-3000}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - DATA_DIR=/data
      - HF_TOKEN=${HF_TOKEN:-}
      - API_KEY=${API_KEY:-}
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=1
      - LOG_LEVEL=${LOG_LEVEL:-info}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
volumes:
  models:
  data:
